name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile policy tooling
        run: >-
          python -m compileall -q
          tools tests/repository tests/packaging tests/supply_chain
      - name: Run repository policy unit tests
        run: python -m unittest discover -s tests/repository -p 'test_*.py'
      - name: Run packaging policy unit tests
        run: python -m unittest discover -s tests/packaging -p 'test_*.py'
      - name: Run supply-chain policy unit tests
        run: python -m unittest discover -s tests/supply_chain -p 'test_*.py'
      - name: Check repository policy
        run: python tools/check_repository.py

  node-contracts:
    name: Node contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.22.0"
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen Node workspace
        run: pnpm install --frozen-lockfile
      - name: Lint TypeScript workspace
        run: pnpm lint
      - name: Check TypeScript workspace formatting
        run: pnpm format:check
      - name: Type-check contract boundaries
        run: pnpm typecheck
      - name: Run contract smoke tests
        run: pnpm test
      - name: Build all contract packages
        run: pnpm build
      - name: Inspect package licenses and inventory
        run: |
          pnpm licenses list --json | tee "$RUNNER_TEMP/node-licenses.json"
          node --input-type=module - "$RUNNER_TEMP/node-licenses.json" <<'NODE'
          import { readFileSync } from "node:fs";

          const approved = new Set([
            "0BSD", // permissive TypeScript runtime helpers
            "Apache-2.0",
            "BlueOak-1.0.0",
            "BSD-2-Clause",
            "BSD-3-Clause",
            "CC-BY-4.0", // attribution-licensed browser compatibility data
            "ISC",
            "MIT",
            "MPL-2.0", // explicitly reviewed packages in supply-chain/policy.json
          ]);
          const inventory = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const rejected = Object.keys(inventory).filter(
            (license) => !approved.has(license),
          );
          if (rejected.length > 0) {
            throw new Error(`Unapproved package licenses: ${rejected.join(", ")}`);
          }
          console.log(`Approved package licenses: ${Object.keys(inventory).join(", ")}`);
          NODE
          pnpm list --recursive --depth Infinity
      - name: Verify no tracked or generated drift
        run: git diff --exit-code

  python-quality-package:
    name: Python ${{ matrix.python }} quality and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Sync frozen Python environment
        run: uv sync --frozen --all-groups
      - name: Lint and check formatting
        run: |
          uv run --frozen ruff check services/backend tests/repository tests/packaging tests/supply_chain tools migrations
          uv run --frozen ruff format --check services/backend tests/repository tests/packaging tests/supply_chain tools migrations
      - name: Type-check backend boundary
        run: uv run --frozen mypy
      - name: Run unit and metadata qualification
        run: uv run --frozen pytest services/backend/tests/unit tests/repository
      - name: Build product distributions
        run: uv build --out-dir "${RUNNER_TEMP}/distributions"
      - name: Verify no tracked file was generated
        run: git diff --exit-code

  foundation-postgresql:
    name: Foundation PostgreSQL ${{ matrix.postgresql }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgresql: ["14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: qualification
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qualification-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qualification"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: qualification
      PGUSER: postgres
      PGPASSWORD: qualification-admin
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Sync frozen Python environment
        run: uv sync --frozen --all-groups
      - name: Run generic foundation adoption gate
        run: >-
          uv run --frozen pytest
          services/backend/tests/integration/test_foundation_postgres.py
      - name: Run Agent-Site database bootstrap and privilege gate
        run: >-
          uv run --frozen pytest
          services/backend/tests/integration/test_database_bootstrap.py
          services/backend/tests/integration/test_local_identity.py
          services/backend/tests/integration/test_human_session.py
          services/backend/tests/integration/test_local_authentication.py
          services/backend/tests/integration/test_control_database_integration.py
          services/backend/tests/integration/test_control_auth_http_integration.py
          services/backend/tests/integration/test_sites.py
          services/backend/tests/integration/test_site_control_http_integration.py
          services/backend/tests/integration/test_render_site_resolution.py
          services/backend/tests/integration/test_human_rbac.py
          services/backend/tests/integration/test_membership_control_http.py
          services/backend/tests/integration/test_current_human_control_http.py

  compose-edge-packaging:
    name: Compose and edge packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect Compose runtime
        run: docker compose version
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.22.0"
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen browser test workspace
        run: pnpm install --frozen-lockfile
      - name: Install exact Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run clean deployment, topology, edge, and failure smoke
        run: sh tools/compose/smoke.sh slaif007ci

  supply-chain-evidence:
    name: Supply-chain evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.22.0"
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify static Compose and supply-chain policy
        run: |
          python tools/compose/verify.py --root .
          python -m tools.supply_chain.policy validate
      - name: Build reproducible artifacts, SBOMs, scans, and evidence
        run: sh tools/supply_chain/run.sh "${RUNNER_TEMP}/supply-chain-evidence"
      - name: Upload checksummed supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/supply-chain-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          overwrite: false
          include-hidden-files: false

  markdown:
    name: Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  mermaid:
    name: Mermaid
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Render Mermaid diagrams
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: python tools/check_mermaid.py

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
