# Reference adapter only. Terminate production TLS in a separately reviewed
# virtual host; never treat forwarded headers as trusted without a proxy policy.
Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    ProxyRequests Off
    ProxyPreserveHost On
    LimitRequestBody 1048576

    RequestHeader set X-Request-ID "%{UNIQUE_ID}e"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}s"
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-%{UNIQUE_ID}e'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'"

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=()"
    Header onsuccess unset Content-Security-Policy
    Header always unset Content-Security-Policy
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-%{UNIQUE_ID}e'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    <LocationMatch "^/admin/sites/[0-9a-f-]{36}/pages/[0-9a-f-]{36}/edit$">
        Header always set Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-%{UNIQUE_ID}e'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    </LocationMatch>
    Header onsuccess unset X-Request-ID
    Header always unset X-Request-ID
    Header always set X-Request-ID "%{UNIQUE_ID}e"
    AddOutputFilterByType DEFLATE application/json text/css text/javascript application/javascript image/svg+xml

    ProxyPass        /api/control/health/live http://control-api:8000/health/live connectiontimeout=5 timeout=60 flushpackets=on
    ProxyPassReverse /api/control/health/live http://control-api:8000/health/live
    ProxyPass        /api/control/health/ready http://control-api:8000/health/ready connectiontimeout=5 timeout=60 flushpackets=on
    ProxyPassReverse /api/control/health/ready http://control-api:8000/health/ready
    ProxyPass        /api/control/v1/ http://control-api:8000/api/control/v1/ connectiontimeout=5 timeout=60 flushpackets=on
    ProxyPassReverse /api/control/v1/ http://control-api:8000/api/control/v1/
    ProxyPass        /api/control/ !
    ProxyPass        /api/editor/health/live http://editor-api:8000/health/live connectiontimeout=5 timeout=60 flushpackets=on
    ProxyPassReverse /api/editor/health/live http://editor-api:8000/health/live
    ProxyPass        /api/editor/health/ready http://editor-api:8000/health/ready connectiontimeout=5 timeout=60 flushpackets=on
    ProxyPassReverse /api/editor/health/ready http://editor-api:8000/health/ready
    ProxyPass        /api/editor/v1/ http://editor-api:8000/api/editor/v1/ connectiontimeout=5 timeout=60 flushpackets=on
    ProxyPassReverse /api/editor/v1/ http://editor-api:8000/api/editor/v1/
    ProxyPass        /api/editor/ !
    ProxyPass        /api/agent/ http://agent-api:8000/ connectiontimeout=5 timeout=60 flushpackets=on
    ProxyPassReverse /api/agent/ http://agent-api:8000/
    ProxyPass        /mcp/ http://mcp-adapter:8000/ connectiontimeout=5 timeout=60 flushpackets=on
    ProxyPassReverse /mcp/ http://mcp-adapter:8000/
    ProxyPass        /media/ http://media-service:8000/ connectiontimeout=5 timeout=60 flushpackets=on
    ProxyPassReverse /media/ http://media-service:8000/
    <Location "/media/">
        LimitRequestBody 105119744
    </Location>
    ProxyPass        /internal/ !
    ProxyPass        / http://web:3000/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://web:3000/
</VirtualHost>
