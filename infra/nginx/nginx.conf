worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    gzip on;
    gzip_min_length 512;
    gzip_types application/json text/css text/javascript application/javascript image/svg+xml;

    # Docker service addresses can change when containers restart. NGINX OSS
    # must re-resolve every edge upstream instead of retaining startup IPs.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    upstream slaif_control_api {
        zone slaif_control_api 64k;
        server control-api:8000 resolve;
    }
    upstream slaif_editor_api {
        zone slaif_editor_api 64k;
        server editor-api:8000 resolve;
    }
    upstream slaif_agent_api {
        zone slaif_agent_api 64k;
        server agent-api:8000 resolve;
    }
    upstream slaif_mcp_adapter {
        zone slaif_mcp_adapter 64k;
        server mcp-adapter:8000 resolve;
    }
    upstream slaif_media_service {
        zone slaif_media_service 64k;
        server media-service:8000 resolve;
    }
    upstream slaif_web {
        zone slaif_web 64k;
        server web:3000 resolve;
    }

    map $uri $slaif_csp {
        default "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'";
        "~*^/admin/sites/[0-9a-f-]{36}/pages/[0-9a-f-]{36}/edit$" "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'";
    }
    map $uri $slaif_preview_cache_control {
        default "";
        "~*^/preview/" "private, no-store";
    }
    map $uri $slaif_preview_pragma {
        default "";
        "~*^/preview/" "no-cache";
    }
    map $uri $slaif_preview_robots {
        default "";
        "~*^/preview/" "noindex, nofollow, noarchive";
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Content-Security-Policy $slaif_csp always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control $slaif_preview_cache_control always;
        add_header Pragma $slaif_preview_pragma always;
        add_header X-Robots-Tag $slaif_preview_robots always;

        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Content-Security-Policy $slaif_csp;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Request-ID;

        location = /api/control/health/live {
            proxy_pass http://slaif_control_api/health/live;
        }

        location = /api/control/health/ready {
            proxy_pass http://slaif_control_api/health/ready;
        }

        location /api/control/v1/ {
            proxy_pass http://slaif_control_api;
        }

        location /api/control/ {
            return 404;
        }

        location = /api/editor/health/live {
            proxy_pass http://slaif_editor_api/health/live;
        }

        location = /api/editor/health/ready {
            proxy_pass http://slaif_editor_api/health/ready;
        }

        location /api/editor/v1/ {
            proxy_pass http://slaif_editor_api;
        }

        location /api/editor/ {
            return 404;
        }

        location = /api/agent/health/live {
            proxy_pass http://slaif_agent_api/health/live;
        }

        location = /api/agent/health/ready {
            proxy_pass http://slaif_agent_api/health/ready;
        }

        location /api/agent/ {
            proxy_pass http://slaif_agent_api;
        }

        location /mcp/ {
            proxy_pass http://slaif_mcp_adapter/;
        }

        location /media/ {
            client_max_body_size 105119744;
            proxy_pass http://slaif_media_service/;
        }

        location ^~ /internal/ {
            return 404;
        }

        location / {
            proxy_buffering on;
            proxy_pass http://slaif_web;
        }
    }
}
