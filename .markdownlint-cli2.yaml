# Keep defaults on and document only narrow repository compatibility choices.
config:
  default: true
  # Long architecture references and evidence commands remain readable as-is.
  MD013: false
  # Exactly two trailing spaces are intentional Markdown hard breaks.
  MD009:
    br_spaces: 2
    strict: true
  # The canonical architecture uses H1 appendix headings after its title.
  MD025: false
  # Repeated labels are allowed only when they belong to different sections.
  MD024:
    siblings_only: true
  # The root README uses only these elements for the centered local logo.
  MD033:
    allowed_elements:
      - p
      - a
      - img
  # Preserve the canonical architecture's adjacent title/subtitle pair.
  MD022: false
  # Preserve intentionally continued numbered requirements across prose.
  MD029: false
  # Preserve canonical mixed-spacing governance tables without editing them.
  MD060: false
globs:
  - "**/*.md"
ignores:
  - ".git/**"
  # Strategic instruction snapshots are machine-consumed source artifacts.
  - "oap/strategic-instructions/**"
