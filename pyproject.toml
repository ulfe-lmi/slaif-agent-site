[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[project]
name = "slaif-agent-site"
version = "0.0.0"
description = "Self-hosted, human-governed website workspaces for humans and AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SLAIF Agent-Site contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "agent-cow-postgresql==0.2.0",
  "alembic==1.19.1",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn==0.52.3",
]

[project.urls]
Documentation = "https://github.com/ulfe-lmi/slaif-agent-site#readme"
Issues = "https://github.com/ulfe-lmi/slaif-agent-site/issues"
Repository = "https://github.com/ulfe-lmi/slaif-agent-site"

[dependency-groups]
build = [
  "build>=1.3,<2",
  "uv-build==0.12.5",
]
qualification = [
  "packaging>=24,<26",
]
quality = [
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
]
test = [
  "httpx==0.28.1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = "slaif_agent_site"
module-root = "services/backend/src"
source-include = ["alembic.ini", "migrations/**"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["services/backend/tests", "tests/repository"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "services/backend/src",
  "services/backend/tests",
  "migrations/alembic",
]

[[tool.mypy.overrides]]
module = ["agentcow.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true
