name: slaif-agent-site

x-image-build-args: &image-build-args
  SOURCE_DATE_EPOCH: "1704067200"
  SLAIF_IMAGE_CREATED: "2024-01-01T00:00:00Z"
  SLAIF_IMAGE_REVISION: "${GITHUB_SHA:-local}"
  SLAIF_IMAGE_VERSION: "${SLAIF_IMAGE_VERSION:-0.0.0}"

x-common-security: &common-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-backend-service: &backend-service
  <<: *common-security
  image: slaif-agent-site-backend:local
  restart: unless-stopped
  init: true
  environment:
    SLAIF_BIND_HOST: 0.0.0.0
    SLAIF_BIND_PORT: "8000"
    SLAIF_LOG_FORMAT: json
    SLAIF_LOG_LEVEL: INFO
    SLAIF_MODE: development
    SLAIF_PUBLIC_URL: http://localhost:8080
  expose:
    - "8000"
  tmpfs:
    - /tmp:mode=1777,nosuid,nodev,noexec,size=16m
  depends_on:
    bootstrap:
      condition: service_completed_successfully
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >-
        import urllib.request;
        urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

x-worker-service: &worker-service
  <<: *common-security
  image: slaif-agent-site-backend:local
  restart: unless-stopped
  init: true
  environment:
    SLAIF_LOG_FORMAT: json
    SLAIF_LOG_LEVEL: INFO
    SLAIF_MODE: development
    SLAIF_PUBLIC_URL: http://localhost:8080
  tmpfs:
    - /tmp:mode=1777,nosuid,nodev,noexec,size=16m
  depends_on:
    bootstrap:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 5s

services:
  secrets-init:
    <<: *common-security
    image: slaif-agent-site-backend:local
    build:
      context: .
      dockerfile: services/backend/Dockerfile
      args: *image-build-args
    user: "0:0"
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    command:
      - python
      - /opt/slaif/bin/initialize-local-secrets.py
      - --directory
      - /run/slaif-secrets
      - --control-directory
      - /run/slaif-control
      - --agent-directory
      - /run/slaif-agent
      - --render-directory
      - /run/slaif-render
      - --preview-directory
      - /run/slaif-render-preview
      - --render-auth-directory
      - /run/slaif-render-auth
      - --browser-signing-directory
      - /run/slaif-browser-signing
      - --browser-worker-directory
      - /run/slaif-browser-worker
      - --editor-directory
      - /run/slaif-editor
      - --media-directory
      - /run/slaif-media
      - --media-root
      - /var/lib/slaif/media
      - --browser-artifact-root
      - /var/lib/slaif/browser-artifacts
    restart: "no"
    network_mode: none
    volumes:
      - control-secret:/run/slaif-control
      - agent-secret:/run/slaif-agent
      - local-secrets:/run/slaif-secrets
      - render-secret:/run/slaif-render
      - render-preview-secret:/run/slaif-render-preview
      - render-auth-secret:/run/slaif-render-auth
      - browser-signing-secret:/run/slaif-browser-signing
      - browser-worker-secret:/run/slaif-browser-worker
      - browser-artifacts:/var/lib/slaif/browser-artifacts
      - editor-secret:/run/slaif-editor
      - media-secret:/run/slaif-media
      - media-data:/var/lib/slaif/media

  postgres:
    <<: *common-security
    # PostgreSQL 18.6; project-owned security overlay over the exact official image.
    image: slaif-agent-site-postgres:local
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
      args: *image-build-args
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    group_add:
      - "10002"
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: slaif
      POSTGRES_PASSWORD_FILE: /run/slaif-secrets/postgres-password
      POSTGRES_USER: postgres
    expose:
      - "5432"
    tmpfs:
      - /tmp:mode=1777,nosuid,nodev,noexec,size=16m
      - /var/run/postgresql:uid=999,gid=999,mode=3775,nosuid,nodev,noexec,size=16m
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - local-secrets:/run/slaif-secrets:ro
    networks:
      - database
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --quiet --username postgres --dbname slaif"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  bootstrap:
    <<: *common-security
    image: slaif-agent-site-backend:local
    group_add:
      - "10002"
    command: ["python", "-m", "slaif_agent_site.bootstrap", "compose"]
    restart: "no"
    environment:
      SLAIF_BOOTSTRAP_EXPECTED_DATABASE: slaif
      SLAIF_BOOTSTRAP_DEMO_SEED: "true"
      SLAIF_BOOTSTRAP_LOCAL_SECRETS_DIR: /run/slaif-secrets
      SLAIF_BOOTSTRAP_MODE: production
      SLAIF_BOOTSTRAP_OWNER_DSN_FILE: /run/slaif-secrets/owner-dsn
      SLAIF_BOOTSTRAP_PROVISIONER_DSN_FILE: /run/slaif-secrets/provisioner-dsn
    tmpfs:
      - /tmp:mode=1777,nosuid,nodev,noexec,size=16m
    volumes:
      - local-secrets:/run/slaif-secrets:ro
    networks:
      - database
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  control-api:
    <<: *backend-service
    command: ["python", "-m", "slaif_agent_site.control_api"]
    environment:
      SLAIF_BIND_HOST: 0.0.0.0
      SLAIF_BIND_PORT: "8000"
      SLAIF_CONTROL_DSN_FILE: /run/slaif-control/control-dsn
      SLAIF_CONTROL_EXPECTED_DATABASE: slaif
      SLAIF_CONTROL_EXPECTED_LOGIN: slaif_control_login
      SLAIF_CONTROL_EXPECTED_PRIVILEGE_ROLE: slaif_control
      SLAIF_CONTROL_MODE: development
      SLAIF_LOG_FORMAT: json
      SLAIF_LOG_LEVEL: INFO
      SLAIF_MODE: development
      SLAIF_PUBLIC_URL: http://localhost:8080
    volumes:
      - control-secret:/run/slaif-control:ro
    networks: [edge, database]

  editor-api:
    <<: *backend-service
    command: ["python", "-m", "slaif_agent_site.editor_api"]
    environment:
      SLAIF_BIND_HOST: 0.0.0.0
      SLAIF_BIND_PORT: "8000"
      SLAIF_LOG_FORMAT: json
      SLAIF_LOG_LEVEL: INFO
      SLAIF_MODE: development
      SLAIF_PUBLIC_URL: http://localhost:8080
      SLAIF_CONTROL_DSN_FILE: /run/slaif-control/control-dsn
      SLAIF_CONTROL_EXPECTED_DATABASE: slaif
      SLAIF_CONTROL_EXPECTED_LOGIN: slaif_control_login
      SLAIF_CONTROL_EXPECTED_PRIVILEGE_ROLE: slaif_control
      SLAIF_CONTROL_MODE: development
      SLAIF_EDITOR_DSN_FILE: /run/slaif-editor/editor-dsn
      SLAIF_EDITOR_EXPECTED_DATABASE: slaif
      SLAIF_EDITOR_EXPECTED_LOGIN: slaif_editor_login
      SLAIF_EDITOR_EXPECTED_PRIVILEGE_ROLE: slaif_editor_runtime
      SLAIF_EDITOR_MODE: development
    volumes:
      - control-secret:/run/slaif-control:ro
      - editor-secret:/run/slaif-editor:ro
    networks: [edge, database]

  agent-api:
    <<: *backend-service
    command: ["python", "-m", "slaif_agent_site.agent_api"]
    environment:
      SLAIF_BIND_HOST: 0.0.0.0
      SLAIF_BIND_PORT: "8000"
      SLAIF_AGENT_DSN_FILE: /run/slaif-agent/agent-dsn
      SLAIF_AGENT_BROWSER_SIGNING_KEY_FILE: /run/slaif-browser-signing/signing-key
      SLAIF_AGENT_BROWSER_WORKER_ENDPOINT: http://browser-worker:3100
      SLAIF_AGENT_BROWSER_WORKER_SERVICE_CREDENTIAL_FILE: /run/slaif-browser-worker/worker-token
      SLAIF_AGENT_EXPECTED_DATABASE: slaif
      SLAIF_AGENT_EXPECTED_LOGIN: slaif_agent_login
      SLAIF_AGENT_EXPECTED_PRIVILEGE_ROLE: slaif_agent_runtime
      SLAIF_AGENT_MODE: development
      SLAIF_AGENT_DISPATCHER_ENABLED: "true"
      SLAIF_AGENT_DISPATCHER_POLL_INTERVAL_SECONDS: "0.5"
      SLAIF_AGENT_DISPATCHER_BACKOFF_SECONDS: "2"
      SLAIF_AGENT_DISPATCHER_LEASE_SECONDS: "30"
      SLAIF_AGENT_DISPATCHER_RENEWAL_INTERVAL_SECONDS: "10"
      SLAIF_AGENT_DISPATCHER_WORKER_TIMEOUT_SECONDS: "120"
      SLAIF_AGENT_DISPATCHER_CONCURRENCY: "1"
      SLAIF_AGENT_DISPATCHER_SHUTDOWN_TIMEOUT_SECONDS: "5"
      SLAIF_LOG_FORMAT: json
      SLAIF_LOG_LEVEL: INFO
      SLAIF_MODE: development
      SLAIF_PUBLIC_URL: http://localhost:8080
    volumes:
      - agent-secret:/run/slaif-agent:ro
      - browser-signing-secret:/run/slaif-browser-signing:ro
      - browser-worker-secret:/run/slaif-browser-worker:ro
    networks: [edge, database, browser]

  render-api:
    <<: *backend-service
    command: ["python", "-m", "slaif_agent_site.render_api"]
    environment:
      SLAIF_BIND_HOST: 0.0.0.0
      SLAIF_BIND_PORT: "8000"
      SLAIF_LOG_FORMAT: json
      SLAIF_LOG_LEVEL: INFO
      SLAIF_MODE: development
      SLAIF_PUBLIC_URL: http://localhost:8080
      SLAIF_RENDER_DSN_FILE: /run/slaif-render/render-dsn
      SLAIF_RENDER_PREVIEW_DSN_FILE: /run/slaif-render-preview/preview-dsn
      SLAIF_RENDER_SERVICE_TOKEN_FILE: /run/slaif-render-auth/render-token
      SLAIF_RENDER_BROWSER_SIGNING_KEY_FILE: /run/slaif-browser-signing/signing-key
      SLAIF_RENDER_EXPECTED_DATABASE: slaif
      SLAIF_RENDER_EXPECTED_LOGIN: slaif_public_login
      SLAIF_RENDER_EXPECTED_PRIVILEGE_ROLE: slaif_public_reader
      SLAIF_RENDER_PREVIEW_EXPECTED_LOGIN: slaif_preview_login
      SLAIF_RENDER_PREVIEW_EXPECTED_PRIVILEGE_ROLE: slaif_preview_reader
      SLAIF_RENDER_MODE: development
    volumes:
      - render-secret:/run/slaif-render:ro
      - render-preview-secret:/run/slaif-render-preview:ro
      - render-auth-secret:/run/slaif-render-auth:ro
      - browser-signing-secret:/run/slaif-browser-signing:ro
    networks: [application, database]

  mcp-adapter:
    <<: *backend-service
    command: ["python", "-m", "slaif_agent_site.mcp_adapter"]
    networks: [edge, application]

  media-service:
    <<: *backend-service
    command: ["python", "-m", "slaif_agent_site.media_service"]
    environment:
      SLAIF_BIND_HOST: 0.0.0.0
      SLAIF_BIND_PORT: "8000"
      SLAIF_LOG_FORMAT: json
      SLAIF_LOG_LEVEL: INFO
      SLAIF_MODE: development
      SLAIF_PUBLIC_URL: http://localhost:8080
      SLAIF_MEDIA_DSN_FILE: /run/slaif-media/media-dsn
      SLAIF_MEDIA_EXPECTED_DATABASE: slaif
      SLAIF_MEDIA_EXPECTED_LOGIN: slaif_media_login
      SLAIF_MEDIA_EXPECTED_PRIVILEGE_ROLE: slaif_media
      SLAIF_MEDIA_MODE: development
      SLAIF_MEDIA_ROOT: /var/lib/slaif/media
    volumes:
      - media-secret:/run/slaif-media:ro
      - media-data:/var/lib/slaif/media
    networks: [edge, database]

  review-worker:
    <<: *worker-service
    command: ["python", "-m", "slaif_agent_site.review_worker"]
    networks: [database]

  scheduler:
    <<: *worker-service
    command: ["python", "-m", "slaif_agent_site.scheduler"]
    networks: [database]

  media-gc:
    <<: *worker-service
    command: ["python", "-m", "slaif_agent_site.media_gc"]
    volumes:
      - media-data:/var/lib/slaif/media
    networks: [database]

  browser-worker:
    <<: *common-security
    image: slaif-agent-site-browser-worker:local
    build:
      context: .
      dockerfile: services/browser-worker/Dockerfile
      args: *image-build-args
    restart: unless-stopped
    init: true
    user: "10001:10001"
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp=services/browser-worker/seccomp_profile.json
    cpus: "1.0"
    mem_limit: 768m
    pids_limit: 256
    shm_size: 128m
    expose:
      - "3100"
    environment:
      BROWSER_WORKER_ARTIFACT_ROOT: /var/lib/slaif/browser-artifacts
      BROWSER_WORKER_PREVIEW_ORIGIN: http://web:3000
      BROWSER_WORKER_SERVICE_CREDENTIAL_FILE: /run/slaif-browser-worker/worker-token
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=700,nosuid,nodev,noexec,size=64m
    volumes:
      - browser-worker-secret:/run/slaif-browser-worker:ro
      - browser-artifacts:/var/lib/slaif/browser-artifacts
    networks: [browser]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3100/health/ready').then(r => { if (!r.ok)
          process.exit(1)}).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    <<: *common-security
    image: slaif-agent-site-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: *image-build-args
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      SLAIF_BROWSER_PREVIEW_AUTHORITY: localhost:8080
      SLAIF_RENDER_SERVICE_TOKEN_FILE: /run/slaif-render-auth/render-token
    tmpfs:
      - /tmp:mode=1777,nosuid,nodev,noexec,size=16m
    volumes:
      - render-auth-secret:/run/slaif-render-auth:ro
    networks: [edge, application, browser]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      render-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health/ready').then(r => { if (!r.ok)
          process.exit(1)}).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  nginx:
    <<: *common-security
    image: slaif-agent-site-nginx:local
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      args: *image-build-args
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp:uid=101,gid=101,mode=700,nosuid,nodev,noexec,size=16m
    networks: [edge]
    depends_on:
      agent-api:
        condition: service_healthy
      control-api:
        condition: service_healthy
      editor-api:
        condition: service_healthy
      mcp-adapter:
        condition: service_healthy
      media-service:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --spider http://127.0.0.1:8080/health/ready && wget --quiet
          --spider http://127.0.0.1:8080/api/control/health/ready
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  edge: {}
  application:
    internal: true
  database:
    internal: true
  browser:
    internal: true

volumes:
  agent-secret: {}
  browser-artifacts: {}
  browser-signing-secret: {}
  browser-worker-secret: {}
  control-secret: {}
  editor-secret: {}
  local-secrets: {}
  media-data: {}
  media-secret: {}
  postgres-data: {}
  render-secret: {}
  render-preview-secret: {}
  render-auth-secret: {}
